name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  verify:
    name: Code Quality & Tests (Pint, ESLint, Svelte, Pest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl, zip, gd, exif
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Prepare Environment & Wayfinder Types
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan media:check-image-runtime
          npm run build

      - name: Check PHP Code Style (Pint)
        run: vendor/bin/pint --test

      - name: Check Frontend Lint (ESLint)
        run: npm run lint:check

      - name: Check Frontend Types (Svelte)
        run: npm run types:check

      - name: Run Automated Tests (Pest)
        run: ./vendor/bin/pest

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl, zip, gd, exif
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Verify Production Image Runtime Before Transfer
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -eu
            php <<'PHP'
            <?php
            if (!extension_loaded('gd') || !extension_loaded('exif')) {
                file_put_contents('php://stderr', "Production requires PHP GD and EXIF.\n");
                exit(1);
            }
            $support = gd_info();
            foreach (['JPEG Support', 'PNG Support', 'WebP Support'] as $feature) {
                if (!($support[$feature] ?? false)) {
                    file_put_contents('php://stderr', "Production GD is missing: {$feature}.\n");
                    exit(1);
                }
            }
            $image = imagecreatetruecolor(2, 2);
            ob_start();
            $encoded = imagewebp($image, null, 82);
            $bytes = ob_get_clean();
            $decoded = $encoded && is_string($bytes) && $bytes !== '' ? @imagecreatefromstring($bytes) : false;
            if ($decoded === false) {
                file_put_contents('php://stderr', "Production WebP encode/decode check failed.\n");
                exit(1);
            }
            echo "Production image runtime ready.\n";
            PHP

      - name: Deploy via Rsync over SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          ARGS: "-rlgoDzvcO --delete --exclude=.env --exclude=node_modules --exclude=.git --exclude=.github --exclude=storage/** --exclude=database/*.sqlite* --exclude=tests --exclude=/docs/"
          REMOTE_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          REMOTE_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          TARGET: ${{ secrets.HOSTINGER_TARGET_DIR }}

      - name: Post-Deploy Optimization
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd ${{ secrets.HOSTINGER_TARGET_DIR }}
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
